[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corets"
version = "0.1.0"
description = "Code-grounded Repository Task Synthesis and tool-trajectory distillation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agent = ["httpx>=0.27,<1", "langchain-core>=0.3,<0.4", "langgraph>=0.2,<0.7", "rich>=13,<15", "PyYAML>=6,<7"]
train = ["ms-swift==3.12.0", "transformers==4.57.1"]

[project.scripts]
corets = "corets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
